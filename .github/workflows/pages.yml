name: Décoder les icônes PNG
# GitHub Pages sert directement la branche main (racine) : ce workflow ne déploie rien.
# Il décode le paquet d'icônes PNG envoyé en base64 (icons/icons-png.tar.b64) et enregistre les PNG.
on:
  push:
    branches: [main]
    paths: ['icons/icons-png.tar.b64', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: decode-icons
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décoder les icônes
        run: |
          base64 -d icons/icons-png.tar.b64 | tar -xvf -
          git rm -q --ignore-unmatch icons/*.png.b64
          ls -l icons
      - name: Enregistrer les PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A icons
          if git diff --cached --quiet; then echo "Rien à enregistrer"; exit 0; fi
          git commit -m "Icônes PNG décodées"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
