<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1B3F">
  <meta name="description" content="Scan Finance – l'app qui traque tes abonnements. Maquette cliquable (données d'exemple).">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Scan Finance">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Scan Finance – l'app qui traque tes abonnements</title>
</head>
<body>
  <div id="app" class="app"></div>
  <nav id="tabbar" class="tabbar" hidden>
    <a href="#/dashboard" data-tab="dashboard"><span class="ti">⌂</span>Accueil</a>
    <a href="#/abonnements" data-tab="abonnements"><span class="ti">≡</span>Abonnements</a>
    <a href="#/alertes" data-tab="alertes"><span class="ti">🔔</span>Alertes<i id="alert-dot" class="dot"></i></a>
    <a href="#/premium" data-tab="premium"><span class="ti">★</span>Premium</a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
